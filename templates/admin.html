<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yêu cầu hỗ trợ | Quản trị Bách Phục</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f1ea; margin: 0; color: #222; }
    header { background: #2f4a2f; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    select, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #bbb; }
    button { background: #2f4a2f; color: #fff; border: 0; cursor: pointer; }
    button.danger { background: #b00020; }
    button.link { background: none; color: #fff; border: 1px solid #fff; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .meta { color: #666; font-size: 13px; }
    .msg { white-space: pre-wrap; margin: 8px 0; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e6e0cf; }
    .badge.moi { background: #ffe7a3; }
    .badge.da_xu_ly { background: #c9e7c9; }
    form.update { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    form.update input[type=text] { flex: 1; min-width: 200px; padding: 8px; border: 1px solid #bbb; border-radius: 4px; }
    .empty { color: #666; text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>Yêu cầu hỗ trợ ({{ total }})</h1>
    <nav>
      <a href="{{ url_for('admin_dashboard') }}" style="color:#fff;margin-right:16px;">Yêu cầu hỗ trợ</a>
      <a href="{{ url_for('admin_orders') }}" style="color:#fff;margin-right:16px;">Đơn hàng</a>
    </nav>
    <form method="post" action="{{ url_for('admin_logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link" type="submit">Đăng xuất</button>
    </form>
  </header>
  <main>
    <div class="toolbar">
      <form method="get" action="{{ url_for('admin_dashboard') }}">
        <select name="status" onchange="this.form.submit()">
          <option value="">Tất cả trạng thái</option>
          {% for key, label in statuses.items() %}
          <option value="{{ key }}" {% if current_status == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </form>
    </div>

    {% for r in items %}
    <div class="card">
      <div class="card-head">
        <strong>#{{ r.id }} — {{ r.name }} — {{ r.phone }}</strong>
        <span class="badge {{ r.status }}">{{ statuses.get(r.status, r.status) }}</span>
      </div>
      <div class="meta">{{ r.created_at }} · Dòng trà: {{ r.dong_tra }}</div>
      {% if r.loi_nhan %}<div class="msg">{{ r.loi_nhan }}</div>{% endif %}

      <form class="update" method="post" action="{{ url_for('admin_update', req_id=r.id) }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <select name="status">
          {% for key, label in statuses.items() %}
          <option value="{{ key }}" {% if r.status == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
        <input type="text" name="ghi_chu" value="{{ r.ghi_chu }}" placeholder="Ghi chú xử lý">
        <button type="submit">Lưu</button>
      </form>
      <form method="post" action="{{ url_for('admin_delete', req_id=r.id) }}" onsubmit="return confirm('Xóa yêu cầu #{{ r.id }}?');" style="margin-top:8px">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="danger" type="submit">Xóa</button>
      </form>
    </div>
    {% else %}
    <div class="empty">Chưa có yêu cầu nào.</div>
    {% endfor %}
  </main>
</body>
</html>
