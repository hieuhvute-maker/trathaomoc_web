<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | Bách Phục</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f1ea; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 8px; width: 320px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 20px; color: #2f4a2f; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #2f4a2f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { color: #b00020; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <form class="box" method="post" action="{{ url_for('admin_login') }}">
    <h1>Quản trị Bách Phục</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="password" name="password" placeholder="Mật khẩu" required autofocus>
    <button type="submit">Đăng nhập</button>
  </form>
</body>
</html>
